[package]
name = "rei"
version = "1.0.0"
description = "REI — Chat with your PDFs using local or cloud AI"
authors = ["you"]
license = "MIT"
repository = "https://github.com/someonealreadytookmyname/rei"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
portpicker = "0.1"
